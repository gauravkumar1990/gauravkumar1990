name: Build Android APK

on:
  push:
    branches:
      - todo-reminder-apk
    paths:
      - 'todo-reminder/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-reminder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Align Expo dependencies
        run: CI=1 npx expo install --fix

      - name: Verify Expo project
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-reminder-apk
          path: todo-reminder/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
