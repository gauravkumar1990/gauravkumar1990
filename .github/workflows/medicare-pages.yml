name: Remove hospital demo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/medicare-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: medicare-pages
  cancel-in-progress: false
jobs:
  remove:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Unpublish GitHub Pages
        id: unpublish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/pages"
      - name: Configure removal page if unpublishing is unavailable
        if: steps.unpublish.outcome == 'failure'
        uses: actions/configure-pages@v5
      - name: Remove app from published content
        if: steps.unpublish.outcome == 'failure'
        run: |
          mkdir -p removed
          echo '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Project removed</title><p>This project has been removed.</p></html>' > removed/index.html
          cp removed/index.html removed/404.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.unpublish.outcome == 'failure'
        with:
          path: removed
      - name: Publish removal
        if: steps.unpublish.outcome == 'failure'
        uses: actions/deploy-pages@v4
