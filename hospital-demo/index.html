const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);const iso=()=>new Date().toISOString();const day=()=>new Date().toISOString().slice(0,10);const offset=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};const fmt=s=>new Date(s).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});const money=n=>'₹'+Number(n).toLocaleString('en-IN');
function seed(){let patients=[{id:'MC-1001',name:'Aarav Mehta',age:42,sex:'Male',location:'OPD · Room 03',allergy:'Penicillin',complaint:'Cough and fever',diagnosis:'',notes:[],rx:[],orders:[]},{id:'MC-1002',name:'Diya Shah',age:29,sex:'Female',location:'Ward A · Bed 08',allergy:'None reported — verify',complaint:'Wound follow-up',diagnosis:'',notes:[],rx:[],orders:[]},{id:'MC-1003',name:'Kabir Patel',age:61,sex:'Male',location:'OPD · Room 02',allergy:'Ibuprofen',complaint:'Diabetes review',diagnosis:'',notes:[],rx:[],orders:[]},{id:'MC-1004',name:'Mira Joshi',age:35,sex:'Female',location:'Day care · Bed 04',allergy:'Latex',complaint:'Planned procedure',diagnosis:'',notes:[],rx:[],orders:[]}];let tasks=departments.filter(d=>d[0]!=='overview').flatMap((d,j)=>d[4].map((name,i)=>({id:uid(),dept:d[0],patient:patients[(j+i)%4].id,name,status:i===2?'Completed':i===1?'In progress':'Pending',priority:i===0?'Priority':'Routine',date:iso(),note:i===2?'Demonstration record':''})));let stocks=departments.filter(d=>d[0]!=='overview').flatMap((d,i)=>[['Examination gloves',180,80,180],['Sterile gauze',24,40,45],['Disposable syringe',0,30,200],['Surface disinfectant',12,8,-3]].map((x,j)=>({id:uid(),dept:d[0],name:x[0],qty:x[1],reorder:x[2],expiry:offset(x[3]),batch:'B'+(100+i)+j,unit:j===3?'bottle':'piece',controlled:false,h1:false})));stocks.push({id:uid(),dept:'pharmacy',name:'Paracetamol 500 mg',qty:400,reorder:100,expiry:offset(300),batch:'PCM-24',unit:'tablet',controlled:false,h1:false},{id:uid(),dept:'pharmacy',name:'Controlled medicine — demo register',qty:0,reorder:0,expiry:offset(300),batch:'CTRL-DEMO',unit:'unit',controlled:true,h1:false});return{version:1,patients,tasks,stocks,ledger:[],audit:[],invoices:[]}}
let db;try{db=JSON.parse(localStorage.getItem('medicare-one-v1'))||seed()}catch{db=seed()}let dept='overview',tab='Dashboard',patientId='MC-1001',filter='All',report='',suggestions=null,stream=null,scanLoop=null,scanner=null;let storageOK=true;
function save(){try{localStorage.setItem('medicare-one-v1',JSON.stringify(db))}catch{storageOK=false;toast('Storage unavailable. Changes will last only in this session.')}}function audit(action,patient=patientId){db.audit.unshift({id:uid(),time:iso(),dept,patient,action,actor:'Demo clinician'});save()}function toast(t){$('#toast').className='toast';$('#toast').textContent=t;setTimeout(()=>{$('#toast').textContent='';$('#toast').className=''},4200)}function p(){return db.patients.find(x=>x.id===patientId)}function d(){return departments.find(x=>x[0]===dept)}function tasks(){return db.tasks.filter(x=>dept==='overview'||x.dept===dept)}function stock(){return db.stocks.filter(x=>dept==='overview'||x.dept===dept)}function badge(v){return `<span class="badge ${/Completed|Authorized|Available/.test(v)?'green':/Expired|Rejected|Zero/.test(v)?'red':/Pending|Priority|Low|Near/.test(v)?'warn':''}">${esc(v)}</span>`}function btn(text,action,cls=''){return `<button type="button" class="${cls}" onclick="${action}">${text}</button>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">No records for this selection.</td></tr>`}</tbody></table></div>`}
function render(){let group='';$('#app').innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><span>✚</span> MediCare<span>One</span></div><small style="padding:0 10px;color:#aec5d4">HOSPITAL WORKSPACE</small>${departments.map(x=>{let g=x[2]!==group?`<div class="navlabel">${group=x[2]}</div>`:'';return g+`<button class="${dept===x[0]?'active':''}" onclick="navigate('${x[0]}')">${esc(x[1])}</button>`}).join('')}<div class="navlabel">DEMO CONTROLS</div>${btn('About this demo','about()')}${btn('Export demo data','backup()')}${btn('Reset demo','resetDialog()')}</aside><main class="main"><header class="topbar">${btn('☰',"$('#sidebar').classList.toggle('open')",'mobilemenu')}<form class="search" onsubmit="event.preventDefault();searchPatients($('#globalSearch').value)"><input id="globalSearch" aria-label="Find patient" placeholder="Find patient by name, UHID or scan code…" autocomplete="off"></form>${btn('⌕ <span class="scantext">Find</span>',"searchPatients($('#globalSearch').value)")}${btn('▣ <span class="scantext">Scan patient</span>','scanModal()','primary')}<span class="demo">FICTIONAL DATA · DEMO</span><div class="avatar" title="Demo clinician">DR</div></header><div class="content"><div class="heading"><div><div class="eyebrow">MEDICARE GENERAL HOSPITAL</div><h1>${esc(d()[1])}</h1><p class="muted">${esc(d()[3])}</p></div><div class="actions">${dept==='reception'?btn('+ Register patient','registration()','primary'):btn('+ New task','taskForm()','primary')}</div></div>${patientHeader()}<nav class="tabs" aria-label="Department views">${['Dashboard','Worklist','Patient record','Clinical assistant','Inventory','Reports'].map(t=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('')}</nav><div id="view">${view()}</div><footer>Demonstration workspace · Changes saved in this browser only · No real patient data · ${storageOK?'Local saving available':'Session-only storage'}</footer></div></main></div>`;save()}
function patientHeader(){let q=p();return `<section class="patient"><div class="avatar">${esc(q.name.split(' ').map(x=>x[0]).join(''))}</div><div class="grow"><div class="name">${esc(q.name)} <span class="badge">Active patient</span></div><div class="meta muted">${q.id} &nbsp; · &nbsp; ${q.age} years / ${q.sex} &nbsp; · &nbsp; ${esc(q.location)}</div></div><div><small>ALLERGIES / ALERTS</small><div>${badge(q.allergy)}</div></div>${btn('Patient code','codeModal()')}${btn('Change','searchPatients(\'\')')}</section>`}function navigate(v){dept=v;tab='Dashboard';report='';filter='All';render()}function setTab(v){tab=v;filter='All';report='';render()}
function view(){if(tab==='Dashboard')return dashboard();if(tab==='Worklist')return worklist();if(tab==='Patient record')return recordView();if(tab==='Clinical assistant')return assistantView();if(tab==='Inventory')return inventoryView();return reportsView()}
function metric(label,value,hint,action){return `<button class="stat" onclick="${action}"><span class="metriclabel">${label}</span><strong>${value}</strong><small>${hint}<span>↗</span></small></button>`}
function dashboard(){let t=tasks(),s=stock(),pending=t.filter(x=>x.status!=='Completed'),low=s.filter(x=>x.qty<=x.reorder);return `<div class="stats">${metric('Open tasks',pending.length,'Open worklist',"filter='Open';tab='Worklist';render()")}${metric('Patients in worklist',new Set(t.map(x=>x.patient)).size,'See patient encounters',"report='Patient encounters';tab='Reports';render()")}${metric('Completed tasks',t.filter(x=>x.status==='Completed').length,'Review completed work',"filter='Completed';tab='Worklist';render()")}${metric('Stock alerts',low.length,'Review reorder list',"tab='Inventory';filter='Low';render()")}</div><div class="grid"><section class="card"><div class="cardhead"><h2>Department worklist</h2>${btn('View all →',"setTab('Worklist')")}</div>${taskTable(pending.slice(0,7))}</section><div><section class="card"><div class="cardhead"><h2>Patient next steps</h2><span class="badge">${p().id}</span></div>${db.tasks.filter(x=>x.patient===patientId&&x.status!=='Completed').slice(0,4).map(x=>`<button class="listbtn" onclick="openTask('${x.id}')"><span>${esc(x.name)}<small>${esc(departments.find(z=>z[0]===x.dept)[1])}</small></span><span>→</span></button>`).join('')||'<p class="empty">No pending tasks.</p>'}</section><section class="card"><h2>Department readiness</h2><div class="actions" style="justify-content:space-between"><span>Tasks completed</span><strong>${t.filter(x=>x.status==='Completed').length} / ${t.length}</strong></div><div class="progress" style="margin:12px 0 22px"><i style="width:${t.length?t.filter(x=>x.status==='Completed').length/t.length*100:0}%"></i></div>${btn('Inventory & supplies →',"setTab('Inventory')")}</section></div></div>${dept==='overview'?`<section class="card"><h2>Explore departments</h2><div class="reportlist">${departments.slice(1).map(x=>`<button class="listbtn" onclick="navigate('${x[0]}')"><span>${x[1]}<small>${db.tasks.filter(t=>t.dept===x[0]&&t.status!=='Completed').length} open tasks · Dashboard, stock & reports</small></span>↗</button>`).join('')}</div></section>`:''}`}
function taskTable(arr){return table(['PATIENT','TASK / DEPARTMENT','STATUS','ACTION'],arr.map(x=>{let q=db.patients.find(y=>y.id===x.patient);return `<tr><td><b>${esc(q?.name||'Department task')}</b><small>${esc(x.patient)}</small></td><td>${esc(x.name)}<small>${departments.find(z=>z[0]===x.dept)?.[1]}</small></td><td>${badge(x.status)}</td><td>${btn('Open',`openTask('${x.id}')`)}</td></tr>`}))}
function worklist(){let arr=tasks().filter(x=>filter==='All'||filter==='Open'&&x.status!=='Completed'||x.status===filter||filter==='This patient'&&x.patient===patientId);return `<section class="card"><div class="cardhead"><h2>Worklist <span class="badge">${arr.length}</span></h2>${btn('+ New task','taskForm()','primary')}</div><div class="actions" style="margin-bottom:18px">${['All','Open','Pending','In progress','Completed','This patient'].map(v=>btn(v,`filter='${v}';render()`,filter===v?'primary':'')).join('')}</div>${taskTable(arr)}</section>`}
function modal(title,body,wide=false){$('#overlay').innerHTML=`<div class="modalback"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">${btn('✕','closeModal()','close')}<h2>${title}</h2>${body}</section></div>`;setTimeout(()=>$('#overlay input')?.focus(),50)}async function closeModal(){clearTimeout(scanLoop);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(scanner){try{await scanner.stop()}catch{}scanner=null}$('#overlay').innerHTML='';document.body.classList.remove('printmodal')}
function searchPatients(query=''){let q=query.trim().toLowerCase(),arr=db.patients.filter(x=>[x.name,x.id].some(v=>v.toLowerCase().includes(q)));modal('Find patient',`<form class="actions" onsubmit="event.preventDefault();searchPatients($('#patientQuery').value)"><input id="patientQuery" aria-label="Patient query" value="${esc(query)}" placeholder="Name or UHID" style="flex:1">${btn('Search',"searchPatients($('#patientQuery').value)")}</form><div style="margin-top:18px">${arr.map(x=>`<button class="listbtn" onclick="confirmPatient('${x.id}')"><span>${esc(x.name)}<small>${x.id} · ${x.age} years · ${x.sex} · ${esc(x.location)}</small></span>Open →</button>`).join('')||'<p class="empty">No matching patient. Check the code or register a new patient.</p>'}</div>${btn('+ Register patient','registration()')}`)}function confirmPatient(id){let q=db.patients.find(x=>x.id===id);modal('Confirm patient identity',`<div class="notice info">Verify identity with the patient before continuing.</div><h2>${esc(q.name)}</h2><p>${q.id} · ${q.age} years · ${q.sex}</p><p>${esc(q.location)}</p><p>Allergies: <b>${esc(q.allergy)}</b></p>${btn('Confirm & open patient',`selectPatient('${id}')`,'primary')}`)}function selectPatient(id){patientId=id;suggestions=null;closeModal();audit('Patient selected');render();toast('Patient context updated across all departments')}
function openTask(id){let x=db.tasks.find(t=>t.id===id);patientId=x.patient;suggestions=null;render();modal(x.name,`<p><b>${esc(p().name)}</b> · ${p().id}</p><p>${departments.find(d=>d[0]===x.dept)[1]}</p><form onsubmit="event.preventDefault();saveTask('${id}')"><label>Status<select id="taskStatus">${['Pending','In progress','Completed','Cancelled'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="fieldrow">Procedure / task findings<textarea id="taskNote" required placeholder="Record findings or completion details">${esc(x.note)}</textarea></label><label class="checkrow"><input type="checkbox" required>I have verified the patient identity and reviewed this record.</label><div class="actions"><button class="primary" type="submit">Save task record</button>${btn('Open patient record',"closeModal();setTab('Patient record')")}</div></form>`)}function saveTask(id){let x=db.tasks.find(t=>t.id===id);x.status=$('#taskStatus').value;x.note=$('#taskNote').value.trim();x.updated=iso();audit(x.name+': '+x.status,x.patient);closeModal();render();toast('Task saved; dashboard updated')}
function taskForm(){modal('Create departmental task',`<form onsubmit="event.preventDefault();createTask()"><label>Patient<select id="tp">${db.patients.map(x=>`<option value="${x.id}" ${x.id===patientId?'selected':''}>${esc(x.name)} · ${x.id}</option>`).join('')}</select></label><label class="fieldrow">Department<select id="td">${departments.slice(1).map(x=>`<option value="${x[0]}" ${x[0]===dept?'selected':''}>${x[1]}</option>`).join('')}</select></label><label>Task / procedure<input id="tn" required placeholder="e.g. Dressing review"></label><label class="fieldrow">Priority<select id="tpriority"><option>Routine</option><option>Priority</option></select></label><button class="primary">Create task</button></form>`)}function createTask(){db.tasks.unshift({id:uid(),dept:$('#td').value,patient:$('#tp').value,name:$('#tn').value.trim(),priority:$('#tpriority').value,status:'Pending',date:iso(),note:''});audit('Task created',$('#tp').value);closeModal();render();toast('Task added to department worklist')}
function registration(){modal('Register fictional patient',`<div class="notice">Demo only. Do not enter real personal or health information.</div><form onsubmit="event.preventDefault();registerPatient()"><label>Full name<input id="rn" required maxlength="80"></label><div class="two fieldrow"><label>Age<input id="ra" type="number" min="0" max="120" required></label><label>Sex<select id="rs"><option>Female</option><option>Male</option><option>Other / unspecified</option></select></label></div><label>Location<input id="rl" value="Reception"></label><label class="fieldrow">Allergies<input id="rall" value="Unknown — verify" required></label><label>Reason for visit<input id="rc" required></label><button class="primary fieldrow">Register & open</button></form>`)}function registerPatient(){let id='MC-'+(Math.max(...db.patients.map(x=>Number(x.id.slice(3))))+1);db.patients.push({id,name:$('#rn').value.trim(),age:Number($('#ra').value),sex:$('#rs').value,location:$('#rl').value,allergy:$('#rall').value,complaint:$('#rc').value,diagnosis:'',notes:[],rx:[],orders:[]});patientId=id;audit('Patient registered');closeModal();render();toast('New patient registered: '+id)}
function recordView(){let q=p();return `<div class="grid"><div><section class="card"><div class="cardhead"><h2>Clinical record</h2>${btn('Print record','window.print()')}</div><div class="printonly"><h2>${esc(q.name)} · ${q.id}</h2><p>DEMO RECORD — NOT FOR CLINICAL USE</p></div><p><small>REASON FOR VISIT</small><br>${esc(q.complaint)}</p><p><small>PROVISIONAL DIAGNOSIS</small><br>${esc(q.diagnosis||'Not recorded')}</p><form onsubmit="event.preventDefault();saveNote()"><label>Consultation / procedure note<textarea id="clinicalNote" placeholder="Enter assessment, findings and care plan" required></textarea></label><div class="two fieldrow"><label>Provisional diagnosis<input id="diagnosis" value="${esc(q.diagnosis)}"></label><label>Location<input id="location" value="${esc(q.location)}"></label></div><button class="primary">Save clinical note</button></form></section><section class="card"><h2>Encounter timeline</h2>${q.notes.map(n=>`<div class="timeline"><small>${fmt(n.time)} · ${esc(n.dept)}</small>${esc(n.text)}</div>`).join('')||'<p class="empty">No clinical notes yet.</p>'}</section><section class="card"><div class="cardhead"><h2>Prescription</h2>${btn('Review suggestions →',"setTab('Clinical assistant')")}</div>${rxTable(q.rx)}</section></div><div><section class="card"><h2>Investigation orders</h2>${q.orders.map(o=>`<div class="timeline"><b>${esc(o.name)}</b><p>${badge(o.status)}</p>${o.result?`<p>${esc(o.result)}</p>`:''}${btn('Open order',`orderModal('${o.id}')`)}</div>`).join('')||'<p class="empty">No investigations ordered.</p>'}</section><section class="card"><h2>Patient activity</h2>${db.audit.filter(x=>x.patient===patientId).slice(0,6).map(x=>`<div class="timeline">${esc(x.action)}<small>${fmt(x.time)}</small></div>`).join('')||'<p class="empty">No activity yet.</p>'}</section>${dept==='billing'?`<section class="card"><h2>Patient billing</h2>${btn('Create invoice','invoiceForm()','primary')}</section>`:''}</div></div>`}function saveNote(){p().notes.unshift({time:iso(),dept:d()[1],text:$('#clinicalNote').value.trim()});p().diagnosis=$('#diagnosis').value.trim();p().location=$('#location').value.trim();audit('Clinical note saved');render();toast('Patient record updated')}
function rxTable(rx){return table(['MEDICINE','DIRECTIONS','STATUS'],rx.map(r=>`<tr><td>${esc(r.name)}<small>${fmt(r.time)}</small></td><td>${esc(r.dose)}<small>${esc(r.route)} · ${esc(r.frequency)} · ${esc(r.duration)}</small></td><td>${badge('Reviewed draft')}</td></tr>`))}
function assistantView(){let q=p();return `<div class="notice info"><b>Clinical assistant · rule-based demonstration</b><br>Suggestions are educational examples, not validated AI advice. Verify history, examination, allergies, interactions, renal/hepatic function and pregnancy status. No automatic prescribing or test ordering.</div><div class="grid"><section class="card"><h2>Symptoms → reviewed care plan</h2><form onsubmit="event.preventDefault();generateSuggestions()"><label>Symptoms / clinical question<textarea id="symptoms" required>${esc(q.complaint)}</textarea></label><label class="fieldrow">Provisional diagnosis<input id="provisional" value="${esc(q.diagnosis)}" placeholder="Optional — clinician's working diagnosis"></label><p><small>Supported demo scenarios: cough/fever, allergic rhinitis, diabetes follow-up. Unmatched cases require manual assessment.</small></p><button class="primary">Generate review suggestions</button></form><div id="suggestions">${suggestions?.patient===patientId?suggestionHTML():''}</div></section><section class="card"><h2>Current prescription</h2><p class="muted">Only medicines reviewed and added by the clinician appear here.</p>${rxTable(q.rx)}${btn('Add medicine manually','manualMedicine()')}<hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h2>Safety review</h2><p>${badge(q.allergy)}</p><p class="muted">Patient age: ${q.age}. Clinical context and dose suitability must be confirmed for each medicine.</p><p><a href="https://www.nice.org.uk/guidance/ng120" target="_blank" rel="noopener">Acute cough guideline reference ↗</a></p><p><small>Demo suggestions have not undergone clinical validation. Reference links do not certify the engine.</small></p></section></div>`}
function generateSuggestions(){let s=($('#symptoms').value+' '+$('#provisional').value).toLowerCase();let diag=[],labs=[],meds=[],note='No supported scenario matched. Record a clinical assessment and add orders manually.';if(/cough|fever|cold/.test(s)){diag=['Acute respiratory infection — assess duration, examination and severity','Other respiratory causes — consider clinical context'];labs=['CBC — only if clinically indicated','Chest X-ray — only if examination / course warrants'];meds=['Paracetamol'];note='Do not infer bacterial infection or add antibiotics automatically. Assess breathlessness, chest pain, haemoptysis and deterioration urgently.'}else if(/rhinitis|sneez|allerg/.test(s)){diag=['Allergic rhinitis — confirm history and examination'];labs=[];meds=['Cetirizine'];note='Testing is not automatically required. Review sedating effects, contraindications and renal function.'}else if(/diabet|glucose/.test(s)){diag=['Diabetes follow-up — verify existing diagnosis and treatment'];labs=['HbA1c — review last test and indication','Renal function — if monitoring is due'];meds=[];note='No glucose-lowering medicine is auto-suggested without treatment history, glucose data and organ-function review.'}if(qAgeUnsafe()){meds=[];note+=' Medicine suggestions are disabled for patients under 18 in this demo.'}suggestions={patient:patientId,diag,labs,meds,note};$('#suggestions').innerHTML=suggestionHTML();audit('Demo clinical suggestions generated')}function qAgeUnsafe(){return p().age<18}
function suggestionHTML(){return `<div style="margin-top:25px"><h2>Assessment considerations</h2>${suggestions.diag.map(x=>`<p>• ${esc(x)}</p>`).join('')}<div class="notice">${esc(suggestions.note)}</div><h2>Investigation suggestions</h2>${suggestions.labs.map((x,i)=>`<label class="checkrow"><input type="checkbox" name="labSuggest" value="${i}">${esc(x)}</label>`).join('')||'<p class="muted">No automatic laboratory suggestion for this scenario.</p>'}${suggestions.labs.length?btn('Order selected investigations','approveLabs()'):''}<h2 style="margin-top:25px">Medicine candidates</h2><p class="muted">Delete unsuitable candidates; enter all prescription directions before adding.</p>${suggestions.meds.map((m,i)=>`<div class="medrow"><div class="cardhead"><b>${esc(m)}</b>${btn('Delete',`suggestions.meds.splice(${i},1);$('#suggestions').innerHTML=suggestionHTML();toast('Candidate removed. Re-enter directions for remaining medicines.')`,'danger')}</div><div class="two"><label>Strength and dose<input id="md${i}" placeholder="Clinician-entered dose"></label><label>Route<input id="mr${i}" placeholder="e.g. Oral"></label><label>Frequency<input id="mf${i}" placeholder="Clinician-entered frequency"></label><label>Duration<input id="mt${i}" placeholder="Clinician-entered duration"></label></div></div>`).join('')||'<p class="muted">No medicine candidates. Use manual prescription entry if appropriate.</p>'}${suggestions.meds.length?`<label class="checkrow"><input id="reviewRx" type="checkbox">I reviewed identity, allergies, interactions, contraindications and every direction.</label>${btn('Add reviewed medicines to prescription','approveMedicines()','primary')}`:''}</div>`}
function approveLabs(){let selected=[...document.querySelectorAll('[name=labSuggest]:checked')].map(x=>suggestions.labs[+x.value]);if(!selected.length)return toast('Select an investigation first');selected.forEach(name=>{let test=name.split(' — ')[0];if(p().orders.some(o=>o.name===test&&o.status!=='Rejected'))return;let od={id:uid(),name:test,status:'Ordered',time:iso(),result:''};p().orders.push(od);db.tasks.unshift({id:uid(),dept:/X-ray/.test(test)?'radiology':'lab',patient:patientId,name:'Investigate: '+test,status:'Pending',priority:'Routine',date:iso(),note:''})});audit('Reviewed investigations ordered');render();toast('Orders added to patient and diagnostic worklists')}
function approveMedicines(){if(!$('#reviewRx')?.checked)return toast('Complete the clinical review checkbox');let rows=suggestions.meds.map((name,i)=>({name,dose:$('#md'+i).value.trim(),route:$('#mr'+i).value.trim(),frequency:$('#mf'+i).value.trim(),duration:$('#mt'+i).value.trim(),time:iso()}));if(rows.some(x=>!x.dose||!x.route||!x.frequency||!x.duration))return toast('Enter dose, route, frequency and duration for every medicine');p().rx.push(...rows);audit('Reviewed prescription draft saved');suggestions=null;render();toast('Reviewed medicines added to prescription draft')}
function manualMedicine(){modal('Add reviewed medicine',`<form onsubmit="event.preventDefault();saveManualMedicine()"><label>Medicine<input id="mn" required></label><div class="two fieldrow">${[['Dose / strength','dose'],['Route','route'],['Frequency','frequency'],['Duration','duration']].map(x=>`<label>${x[0]}<input id="m_${x[1]}" required></label>`).join('')}</div><label class="checkrow"><input type="checkbox" required>I verified the patient, allergies and prescription suitability.</label><button class="primary">Add to prescription draft</button></form>`)}function saveManualMedicine(){p().rx.push({name:$('#mn').value.trim(),dose:$('#m_dose').value,route:$('#m_route').value,frequency:$('#m_frequency').value,duration:$('#m_duration').value,time:iso()});audit('Manual prescription draft added');closeModal();render()}
function orderModal(id){let o=p().orders.find(x=>x.id===id);modal('Investigation: '+esc(o.name),`<p>${esc(p().name)} · ${p().id}</p><form onsubmit="event.preventDefault();saveOrder('${id}')"><label>Status<select id="os">${['Ordered','Collected','Received','Processing','Verified','Authorized','Rejected'].map(v=>`<option ${v===o.status?'selected':''}>${v}</option>`).join('')}</select></label><label class="fieldrow">Result with units/reference interval, or rejection reason<textarea id="or">${esc(o.result)}</textarea></label><label class="checkrow"><input type="checkbox" required>I reviewed the specimen / patient identity and this entry.</label><button class="primary">Save investigation record</button></form>`)}function saveOrder(id){let o=p().orders.find(x=>x.id===id),status=$('#os').value,result=$('#or').value.trim();if(['Verified','Authorized','Rejected'].includes(status)&&!result)return toast('Result or rejection reason is required');o.status=status;o.result=result;o.updated=iso();audit('Investigation '+status);closeModal();render();toast('Investigation record updated')}
function stockStatus(x){return x.expiry<day()?'Expired':x.qty===0?'Zero stock':x.expiry<=offset(90)?'Near expiry':x.qty<=x.reorder?'Low stock':'Available'}
function inventoryView(){let arr=stock().filter(x=>filter!=='Low'||x.qty<=x.reorder);return `<div class="stats">${metric('Stock lines',stock().length,'Batch-level inventory',"filter='All';render()")}${metric('Reorder / zero',stock().filter(x=>x.qty<=x.reorder).length,'Review stock alerts',"filter='Low';render()")}${metric('Near expiry',stock().filter(x=>x.expiry>=day()&&x.expiry<=offset(90)).length,'Next 90 days',"tab='Reports';report='Near expiry';render()")}${metric('Utilisation entries',db.ledger.filter(x=>(dept==='overview'||x.dept===dept)&&x.type==='Utilise').length,'Patient-linked ledger',"tab='Reports';report='Consumable utilisation';render()")}</div><section class="card"><div class="cardhead"><h2>Department inventory</h2><div class="actions">${btn('+ Add stock item','stockForm()')}${btn('Record transaction','transactionForm()','primary')}</div></div><div class="notice info">Issues use the selected batch. Expired batches and insufficient quantities are blocked. Check earliest expiry before issue. Each utilisation links to a patient or department purpose.</div>${table(['ITEM / BATCH','DEPARTMENT','ON HAND','REORDER','EXPIRY','STATUS','ACTION'],arr.map(x=>`<tr><td><b>${esc(x.name)}</b><small>${esc(x.batch)} · ${esc(x.unit)}</small></td><td>${departments.find(d=>d[0]===x.dept)[1]}</td><td><b>${x.qty}</b></td><td>${x.reorder}</td><td>${x.expiry}</td><td>${badge(stockStatus(x))}</td><td>${btn('Manage',`transactionForm('${x.id}')`)}</td></tr>`))}</section><section class="card"><h2>Recent stock movements</h2>${ledgerTable(db.ledger.filter(x=>dept==='overview'||x.dept===dept).slice(0,8))}</section>`}
function stockForm(){modal('Add inventory batch',`<form onsubmit="event.preventDefault();addStock()"><label>Department<select id="sd">${departments.slice(1).map(x=>`<option value="${x[0]}" ${x[0]===dept?'selected':''}>${x[1]}</option>`).join('')}</select></label><label class="fieldrow">Item name<input id="sn" required></label><div class="two"><label>Batch<input id="sb" required></label><label>Expiry date<input id="se" type="date" required></label><label>Opening quantity<input id="sq" type="number" min="0" step="1" required></label><label>Reorder level<input id="sr" type="number" min="0" step="1" required></label><label>Unit<input id="su" value="piece" required></label><label>Register category<select id="sc"><option>General</option><option>Narcotic / controlled</option><option>Schedule H1</option></select></label></div><button class="primary fieldrow">Save stock batch</button></form>`)}function addStock(){let x={id:uid(),dept:$('#sd').value,name:$('#sn').value.trim(),batch:$('#sb').value.trim(),expiry:$('#se').value,qty:+$('#sq').value,reorder:+$('#sr').value,unit:$('#su').value.trim(),controlled:$('#sc').value==='Narcotic / controlled',h1:$('#sc').value==='Schedule H1'};if(db.stocks.some(s=>s.dept===x.dept&&s.name.toLowerCase()===x.name.toLowerCase()&&s.batch===x.batch))return toast('This item and batch already exists; use Receive');db.stocks.push(x);db.ledger.unshift({id:uid(),time:iso(),dept:x.dept,item:x.name,batch:x.batch,type:'Opening',qty:x.qty,balance:x.qty,patient:'',note:'Opening stock',controlled:x.controlled,h1:x.h1});audit('Stock batch added','');closeModal();render()}
function transactionForm(id){let arr=stock().sort((a,b)=>a.expiry.localeCompare(b.expiry));if(!arr.length)return stockForm();modal('Record inventory transaction',`<form onsubmit="event.preventDefault();reviewTransaction()"><label>Item / batch — sorted by expiry<select id="xi">${arr.map(x=>`<option value="${x.id}" ${id===x.id?'selected':''}>${esc(x.name)} · ${esc(x.batch)} · ${x.qty} available · ${x.expiry}</option>`).join('')}</select></label><div class="two fieldrow"><label>Transaction<select id="xt" onchange="$('#destWrap').hidden=this.value!=='Transfer'"><option>Utilise</option><option>Receive</option><option>Transfer</option><option>Adjust count</option></select></label><label>Quantity / counted balance<input id="xq" type="number" min="0" step="1" required></label></div><label id="destWrap" hidden>Transfer destination<select id="xd">${departments.slice(1).filter(x=>x[0]!==dept).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></label><label class="fieldrow">Patient link<select id="xp"><option value="">Department use — no patient</option>${db.patients.map(x=>`<option value="${x.id}" ${x.id===patientId?'selected':''}>${esc(x.name)} · ${x.id}</option>`).join('')}</select></label><label>Reason / recipient / document reference<input id="xn" required></label><label class="fieldrow">Witness / approving staff (required for controlled stock)<input id="xw"></label><button class="primary">Review transaction</button></form>`)}
let pendingTx=null;function reviewTransaction(){let x=db.stocks.find(s=>s.id===$('#xi').value),type=$('#xt').value,qty=+$('#xq').value;if(!Number.isInteger(qty)||qty<0||(type!=='Adjust count'&&qty===0))return toast('Enter a valid positive whole quantity');if(['Utilise','Transfer'].includes(type)){if(x.expiry<day())return toast('Expired stock cannot be issued or transferred');if(qty>x.qty)return toast('Insufficient available stock')}if(type==='Transfer'&&$('#xd').value===x.dept)return toast('Select a different destination');if(x.controlled&&!$('#xw').value.trim())return toast('Controlled stock requires an approving staff / witness entry');pendingTx={stockId:x.id,expected:x.qty,type,qty,patient:$('#xp').value,note:$('#xn').value.trim(),witness:$('#xw').value.trim(),dest:$('#xd').value};modal('Review stock transaction',`<p><b>${esc(x.name)}</b> · ${esc(x.batch)}</p><p>${type}: <b>${qty} ${esc(x.unit)}</b></p><p>Patient: ${esc(pendingTx.patient||'Department use')}</p><p>${esc(pendingTx.note)}</p>${type==='Transfer'?`<p>Destination: ${departments.find(d=>d[0]===pendingTx.dest)[1]}</p>`:''}<div class="notice">${type==='Transfer'?'Demo transfer posts an immediate receipt at the destination. Production requires a separate receiver acknowledgement.':'Submitting updates the stock ledger and department reports.'}</div>${btn('Submit transaction','commitTransaction()','primary')}`)}
function commitTransaction(){if(!pendingTx)return;let t=pendingTx,x=db.stocks.find(s=>s.id===t.stockId);if(x.qty!==t.expected)return toast('Stock changed. Close and review again.');let delta=t.type==='Receive'?t.qty:t.type==='Adjust count'?t.qty-x.qty:-t.qty;x.qty+=delta;let entry={id:uid(),time:iso(),dept:x.dept,item:x.name,batch:x.batch,type:t.type,qty:Math.abs(delta),signed:delta,balance:x.qty,patient:t.patient,note:t.note,witness:t.witness,controlled:x.controlled,h1:x.h1,dest:t.type==='Transfer'?t.dest:''};db.ledger.unshift(entry);if(t.type==='Transfer'){let target=db.stocks.find(s=>s.dept===t.dest&&s.name===x.name&&s.batch===x.batch);if(!target){target={...x,id:uid(),dept:t.dest,qty:0};db.stocks.push(target)}target.qty+=t.qty;db.ledger.unshift({...entry,id:uid(),dept:t.dest,type:'Transfer receipt',signed:t.qty,balance:target.qty,note:'Received from '+departments.find(z=>z[0]===x.dept)[1]+' · '+t.note})}audit('Inventory '+t.type,t.patient);pendingTx=null;render();modal('Transaction saved',`<div class="printonly"><h2>MediCare General Hospital</h2><p>DEMO STOCK DOCUMENT</p></div><p>Reference: ${entry.id.slice(0,8)}</p><p>${fmt(entry.time)}</p><h3>${esc(x.name)}</h3><p>Batch ${esc(x.batch)} · Expiry ${x.expiry}</p><p>${t.type}: ${t.qty} ${esc(x.unit)} · Remaining: ${x.qty}</p><p>Patient / recipient: ${esc(t.patient||t.note)}</p>${t.type==='Transfer'?`<p>To: ${departments.find(z=>z[0]===t.dest)[1]}</p>`:''}<p>Reason: ${esc(t.note)}</p><p>Issuer: Demo clinician · Witness: ${esc(t.witness||'Not recorded')}</p><div class="actions">${btn('Print / Save PDF',"document.body.classList.add('printmodal');window.print()",'primary')}${btn('Done','closeModal()')}</div>`)}
function ledgerTable(arr){return table(['DATE','ITEM / BATCH','TYPE','QUANTITY','BALANCE','PATIENT / PURPOSE'],arr.map(x=>`<tr><td>${fmt(x.time)}</td><td>${esc(x.item)}<small>${esc(x.batch)}</small></td><td>${esc(x.type)}</td><td>${x.signed??x.qty}</td><td>${x.balance}</td><td>${esc(x.patient||'Department use')}<small>${esc(x.note)}</small></td></tr>`))}
const commonReports=['Consumable utilisation','Stock in hand','Stock ledger','Near expiry','Reorder level','Zero stock','Audit trail'];let currentReportData={headers:[],rows:[]};
function reportsView(){let names=[...new Set([...d()[5],...commonReports])];if(!report)return `<section class="card"><div class="cardhead"><h2>${esc(d()[1])} reports</h2><span class="badge">${names.length} reports</span></div><div class="notice info">Audit-support reports. NABH conformity has not been assessed; validate mappings and register fields against the hospital's applicable standards and policies.</div><div class="reportlist">${names.map((n,i)=>`<button class="listbtn" onclick="report='${n}';render()"><span>${n}<small>${/Stock|expiry|stock|Reorder/.test(n)?'Batch-level stock position':'Open records, filter and export'}</small></span>↗</button>`).join('')}</div></section>`;return `<section class="card"><div class="cardhead"><div><small>${esc(d()[1])} / Reports</small><h2>${esc(report)}</h2></div>${btn('All reports',"report='';render()")}</div><div class="two noprint"><label>From<input id="fromDate" type="date" onchange="refreshReport()"></label><label>To<input id="toDate" type="date" onchange="refreshReport()"></label></div><div class="actions fieldrow noprint">${btn('Export CSV','exportReport()')}${btn('Print / Save PDF','window.print()')}${btn('Clear dates',"$('#fromDate').value='';$('#toDate').value='';refreshReport()")}</div><div class="printonly"><h2>MediCare General Hospital · ${esc(report)}</h2><p>Demo report · ${esc(d()[1])} · ${day()}</p></div><p class="muted" id="reportDescription"></p><div id="reportTable">${buildReport('','')}</div></section>`}
function buildReport(from,to){let stockReports=['Stock in hand','Expiry','Near expiry','Reagent expiry','Reorder level','Zero stock','Fast moving','Non-moving'];let s=stock(),t=tasks(),l=db.ledger.filter(x=>dept==='overview'||x.dept===dept);let inDate=x=>{let z=(x.time||x.date||x.updated||'').slice(0,10);return(!from||z>=from)&&(!to||z<=to)};let headers=[],rows=[],description='';if(stockReports.includes(report)){if(report==='Expiry')s=s.filter(x=>x.expiry<day());if(['Near expiry','Reagent expiry'].includes(report))s=s.filter(x=>x.expiry>=day()&&x.expiry<=offset(90));if(report==='Reorder level')s=s.filter(x=>x.qty<=x.reorder);if(report==='Zero stock')s=s.filter(x=>x.qty===0);let use=x=>l.filter(e=>e.type==='Utilise'&&e.item===x.name&&e.batch===x.batch&&e.dept===x.dept&&inDate(e)).reduce((a,e)=>a+e.qty,0);if(report==='Fast moving')s=s.filter(x=>use(x)>0).sort((a,b)=>use(b)-use(a));if(report==='Non-moving')s=s.filter(x=>use(x)===0);headers=['Item','Department','Batch','On hand','Unit','Reorder','Expiry','Utilised in range'];rows=s.map(x=>[x.name,departments.find(d=>d[0]===x.dept)[1],x.batch,x.qty,x.unit,x.reorder,x.expiry,use(x)]);description='Current stock snapshot. Date filters apply only to utilisation totals. Fast moving ranks actual recorded issues; non-moving means no recorded utilisation in the selected period.'}
else if(/utilisation|Stock ledger|Transfers|Instrument utilisation|Schedule H1/.test(report)){l=l.filter(inDate);if(report==='Transfers')l=l.filter(x=>x.type.startsWith('Transfer'));else if(report==='Narcotic utilisation')l=l.filter(x=>x.controlled&&x.type==='Utilise');else if(report==='Schedule H1 register')l=l.filter(x=>x.h1&&x.type==='Utilise');else if(report!=='Stock ledger')l=l.filter(x=>x.type==='Utilise');headers=['Date','Item','Batch','Transaction','Quantity','Balance','Patient','Purpose','Witness'];rows=l.map(x=>[fmt(x.time),x.item,x.batch,x.type,x.signed??x.qty,x.balance,x.patient,x.note,x.witness||'']);description='Recorded inventory transactions only. Controlled registers are demonstrators, not validated statutory formats.'}
else if(report==='Audit trail'){headers=['Time','Department','Patient','Action','Actor'];rows=db.audit.filter(x=>(dept==='overview'||x.dept===dept)&&inDate(x)).map(x=>[fmt(x.time),x.dept,x.patient,x.action,x.actor]);description='Browser-local demo audit history; not tamper-proof.'}
else if(report==='Prescriptions'){headers=['Patient','UHID','Medicine','Dose','Route','Frequency','Duration','Date'];rows=db.patients.flatMap(q=>q.rx.filter(inDate).map(x=>[q.name,q.id,x.name,x.dose,x.route,x.frequency,x.duration,fmt(x.time)]));description='Reviewed prescription drafts across demo patients.'}
else if(['Investigation orders','Specimen register','Authorized results','Rejected specimens','Turnaround time'].includes(report)){headers=['Patient','UHID','Investigation','Status','Ordered','Updated','Result'];rows=db.patients.flatMap(q=>q.orders.filter(x=>inDate(x)&&(report!=='Authorized results'||x.status==='Authorized')&&(report!=='Rejected specimens'||x.status==='Rejected')&&(dept!=='lab'||!/X-ray/.test(x.name))&&(dept!=='radiology'||/X-ray/.test(x.name))).map(x=>[q.name,q.id,x.name,x.status,fmt(x.time),x.updated?fmt(x.updated):'',x.result]));description=report==='Turnaround time'?'Order and latest-update timestamps only; stage-specific turnaround metrics require a production event model.':'Patient investigation records.'}
else if(['Invoice register','Outstanding balances','Collections'].includes(report)){headers=['Invoice','Patient','Description','Total','Paid','Outstanding','Date'];rows=db.invoices.filter(inDate).filter(x=>report!=='Outstanding balances'||x.total>x.paid).map(x=>[x.id,x.patient,x.description,x.total,x.paid,x.total-x.paid,fmt(x.time)]);description='Demo invoices and recorded collections.'}
else{if(report==='Pending tasks')t=t.filter(x=>x.status!=='Completed');else if(report==='Completed tasks')t=t.filter(x=>x.status==='Completed');else if(report==='QC records')t=t.filter(x=>/quality|QC/i.test(x.name));else if(report==='Patient encounters'){headers=['UHID','Patient','Location','Reason','Tasks'];let ids=new Set(t.map(x=>x.patient));rows=db.patients.filter(x=>ids.has(x.id)).map(x=>[x.id,x.name,x.location,x.complaint,t.filter(y=>y.patient===x.id).length]);description='Patients represented in this department worklist. Date filter applies to task-based reports, not this current patient list.'}else{let patterns={'Discharges':'discharge','Discharge register':'discharge','Bed transfers':'transfer','Transfer register':'transfer','Training register':'training','Incident register':'incident','Audit trail':'audit','Corrective actions':'corrective','Calibration register':'calibration','Medication administration':'medication','Handover register':'handover','Implant traceability':'implant','Record release':'release','Newborn register':'newborn','Appointment attendance':'check-in','Waiting queue':'check-in'};if(patterns[report])t=t.filter(x=>x.name.toLowerCase().includes(patterns[report]))}if(!headers.length){headers=['Date','Patient','Task / procedure','Status','Findings'];rows=t.filter(inDate).map(x=>[fmt(x.date),x.patient,x.name,x.status,x.note]);description='Department task register. Specialized clinical fields and validated report templates require further implementation.'}}
currentReportData={headers,rows,description};setTimeout(()=>{let e=$('#reportDescription');if(e)e.textContent=description},0);return table(headers,rows.map(row=>'<tr>'+row.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>'))}
function refreshReport(){let from=$('#fromDate').value,to=$('#toDate').value;if(from&&to&&from>to){toast('From date must be before To date');return}$('#reportTable').innerHTML=buildReport(from,to)}function download(name,content,type='text/plain'){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportReport(){let cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';download('MediCare-'+report.replace(/\W+/g,'-')+'.csv','\ufeff'+[currentReportData.headers,...currentReportData.rows].map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV report exported')}
function invoiceForm(){modal('Create patient invoice',`<form onsubmit="event.preventDefault();saveInvoice()"><p>${esc(p().name)} · ${p().id}</p><label>Service description<input id="idesc" required></label><div class="two fieldrow"><label>Total ₹<input id="itotal" type="number" min="0" step="0.01" required></label><label>Paid ₹<input id="ipaid" type="number" min="0" step="0.01" value="0" required></label></div><button class="primary">Save invoice</button></form>`)}function saveInvoice(){let total=+$('#itotal').value,paid=+$('#ipaid').value;if(paid>total)return toast('Paid amount cannot exceed total');db.invoices.push({id:'INV-'+(db.invoices.length+1).toString().padStart(4,'0'),patient:patientId,description:$('#idesc').value,total,paid,time:iso()});audit('Invoice recorded');closeModal();render();toast('Invoice saved; see billing reports')}
const barcodePatterns={"0": "BaBbBb", "1": "BbBaBb", "2": "BbBbBa", "3": "AbAbBc", "4": "AbAcBb", "5": "AcAbBb", "6": "AbBbAc", "7": "AbBcAb", "8": "AcBbAb", "9": "BbAbAc", "10": "BbAcAb", "11": "BcAbAb", "12": "AaBbCb", "13": "AbBaCb", "14": "AbBbCa", "15": "AaCbBb", "16": "AbCaBb", "17": "AbCbBa", "18": "BbCbAa", "19": "BbAaCb", "20": "BbAbCa", "21": "BaCbAb", "22": "BbCaAb", "23": "CaBaCa", "24": "CaAbBb", "25": "CbAaBb", "26": "CbAbBa", "27": "CaBbAb", "28": "CbBaAb", "29": "CbBbAa", "30": "BaBaBc", "31": "BaBcBa", "32": "BcBaBa", "33": "AaAcBc", "34": "AcAaBc", "35": "AcAcBa", "36": "AaBcAc", "37": "AcBaAc", "38": "AcBcAa", "39": "BaAcAc", "40": "BcAaAc", "41": "BcAcAa", "42": "AaBaCc", "43": "AaBcCa", "44": "AcBaCa", "45": "AaCaBc", "46": "AaCcBa", "47": "AcCaBa", "48": "CaCaBa", "49": "BaAcCa", "50": "BcAaCa", "51": "BaCaAc", "52": "BaCcAa", "53": "BaCaCa", "54": "CaAaBc", "55": "CaAcBa", "56": "CcAaBa", "57": "CaBaAc", "58": "CaBcAa", "59": "CcBaAa", "60": "CaDaAa", "61": "BbAdAa", "62": "DcAaAa", "63": "AaAbBd", "64": "AaAdBb", "65": "AbAaBd", "66": "AbAdBa", "67": "AdAaBb", "68": "AdAbBa", "69": "AaBbAd", "70": "AaBdAb", "71": "AbBaAd", "72": "AbBdAa", "73": "AdBaAb", "74": "AdBbAa", "75": "BdAbAa", "76": "BbAaAd", "77": "DaCaAa", "78": "BdAaAb", "79": "AcDaAa", "80": "AaAbDb", "81": "AbAaDb", "82": "AbAbDa", "83": "AaDbAb", "84": "AbDaAb", "85": "AbDbAa", "86": "DaAbAb", "87": "DbAaAb", "88": "DbAbAa", "89": "BaBaDa", "90": "BaDaBa", "91": "DaBaBa", "92": "AaAaDc", "93": "AaAcDa", "94": "AcAaDa", "95": "AaDaAc", "96": "AaDcAa", "97": "DaAaAc", "98": "DaAcAa", "99": "AaCaDa", "100": "AaDaCa", "101": "CaAaDa", "102": "DaAaCa", "103": "BaAdAb", "104": "BaAbAd", "105": "BaAbCb", "106": "BcCaAaB"};
function barcodeSVG(value){let codes=[104,...Array.from(value).map(c=>c.charCodeAt(0)-32)];let checksum=codes.reduce((n,v,i)=>n+(i?i*v:v),0)%103;codes.push(checksum,106);let x=12,rects='';for(let code of codes){for(let c of barcodePatterns[code]){let width=c.toLowerCase().charCodeAt(0)-96;if(c===c.toUpperCase())rects+=`<rect x="${x}" y="8" width="${width}" height="62"/>`;x+=width}}return `<svg role="img" aria-label="Patient barcode ${esc(value)}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+12} 95" style="max-width:100%;width:340px;background:white"><g fill="black">${rects}</g><text x="${(x+12)/2}" y="87" font-size="10" text-anchor="middle">${esc(value)}</text></svg>`}
function codeModal(){modal('Patient identification code',`<div style="text-align:center"><h2>${esc(p().name)}</h2><p>${p().id} · ${p().age} years · ${p().sex}</p><div id="qrCard" style="display:flex;justify-content:center;margin:20px"></div><p>The code contains only the demo UHID. Scan it from another device or type it into patient search.</p><div class="printonly">DEMO PATIENT — NOT A REAL RECORD</div>${btn('Print patient card',"document.body.classList.add('printmodal');window.print()")}</div>`);if(window.QR_IMAGES?.[patientId])$('#qrCard').innerHTML=window.QR_IMAGES[patientId];else{$('#qrCard').innerHTML=barcodeSVG(patientId)}}
function scanModal(){modal('Scan patient barcode / QR',`<p>Scan a patient card, upload a code image, or use a USB/Bluetooth scanner in the code field.</p><div id="reader"></div><video id="camera" autoplay playsinline muted hidden></video><div id="scanStatus" class="notice info">Camera starts only when you choose Start camera.</div><div class="actions">${btn('Start camera','startScan()','primary')}<label>Scan image<input id="scanFile" type="file" accept="image/*" onchange="scanImage(this.files[0])"></label></div><form class="fieldrow" onsubmit="event.preventDefault();resolveCode($('#scanCode').value)"><label>Barcode / QR value<input id="scanCode" placeholder="MC-1001" autocomplete="off"></label><button class="primary fieldrow">Find patient by code</button></form><small>Camera requires HTTPS and permission. If decoding is unavailable, use a hardware scanner or manual UHID entry.</small>`)}
async function detector(){if(!('BarcodeDetector'in window))return null;let supported=await BarcodeDetector.getSupportedFormats();let formats=['qr_code','code_128','code_39','ean_13','data_matrix'].filter(x=>supported.includes(x));return formats.length?new BarcodeDetector({formats}):null}
async function loadFallback(){if(window.Html5Qrcode)return true;$('#scanStatus').textContent='Loading compatibility scanner…';return new Promise(resolve=>{let script=document.createElement('script');script.src='vendor/html5-qrcode.min.js';script.onload=()=>resolve(!!window.Html5Qrcode);script.onerror=()=>resolve(false);document.head.appendChild(script);setTimeout(()=>resolve(!!window.Html5Qrcode),10000)})}
async function startScan(){try{let det=await detector();if(det){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});let video=$('#camera');video.hidden=false;video.srcObject=stream;await video.play();$('#scanStatus').textContent='Point camera at the patient barcode or QR code.';const tick=async()=>{if(!stream||!$('#camera'))return;try{let codes=await det.detect(video);if(codes.length){resolveCode(codes[0].rawValue);return}}catch{}scanLoop=setTimeout(tick,250)};tick()}else if(await loadFallback()){scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:160}},resolveCode,()=>{});$('#scanStatus').textContent='Point camera at the patient code.'}else $('#scanStatus').textContent='Decoder unavailable in this browser. Use the code field or a hardware scanner.'}catch(e){if($('#scanStatus'))$('#scanStatus').textContent='Camera could not start. Check camera permissions and HTTPS, or enter the code below.'}}
async function scanImage(file){if(!file)return;try{let det=await detector();if(det){let bitmap=await createImageBitmap(file),codes=await det.detect(bitmap);bitmap.close();if(codes.length)return resolveCode(codes[0].rawValue)}else if(await loadFallback()){let reader=new Html5Qrcode('reader');let code=await reader.scanFile(file,false);return resolveCode(code)}$('#scanStatus').textContent='No supported patient code detected. Try a clearer image or enter the UHID.'}catch{$('#scanStatus').textContent='Could not read this image. Try a clear code image or enter the UHID.'}}
async function resolveCode(value){let code=String(value).trim().toUpperCase();let q=db.patients.find(x=>x.id===code);if(!q){if($('#scanStatus'))$('#scanStatus').textContent='Code not recognized: '+value;else toast('Code not recognized');return}await closeModal();confirmPatient(q.id)}
function about(){modal('About MediCare One',`<p>A patient-centred interactive hospital workflow demonstration, with ${departments.length-1} department workspaces.</p><p><b>Implemented:</b> global patient lookup, camera/image scanning where supported, clickable task dashboards, patient records, rule-based clinical suggestion review, prescription drafts, investigation records, batch stock transactions, transfers, report filtering, CSV export and print-to-PDF.</p><p><b>Demo boundaries:</b> browser-local persistence; no server authentication, role enforcement, shared database, production AI, real messaging, device/PACS connections or validated clinical protocols. Specialized modules use configurable task registers, not complete specialist EMRs.</p><p><b>Quality reports:</b> audit-support examples, not a claim of NABH certification or statutory compliance. Validate applicable standards, fields, permissions and retention requirements before production.</p><p><a href="https://nabh.co/" target="_blank" rel="noopener">NABH official site ↗</a></p>`)}function backup(){download('medicare-demo-data.json',JSON.stringify(db,null,2),'application/json')}function resetDialog(){modal('Reset fictional demo data?',`<p>This removes browser-local demo changes and restores the sample patients and stock.</p>${btn('Reset demo data',"db=seed();patientId='MC-1001';suggestions=null;save();closeModal();render()",'danger')}`)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('afterprint',()=>document.body.classList.remove('printmodal'));render();
</script><script src="patient-codes.js"></script></body></html>
