<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZigUI Studio</title><link rel="stylesheet" href="/studio.css"></head><body>
<header><div class="brand"><b>ZigUI Studio</b><span id="status">Ready</span></div><div class="tools"><button data-tool="select" class="active">V</button><button data-tool="frame">F</button><button data-tool="text">T</button><button data-tool="shape">R</button><button id="importBtn">Import</button><input id="importFile" type="file" accept=".json,.zip,.svg,.png,.jpg,.jpeg,.webp,.html" hidden><button id="figmaBtn">Figma</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="save">Save</button><select id="zoom"><option>50%</option><option selected>100%</option><option>150%</option><option>200%</option></select></div><div><button data-device="phone">Phone</button><button data-device="tablet">Tablet</button><button data-device="web">Web</button></div></header>
<main>
<aside class="left"><div class="tabs"><button data-left="layers" class="active">Layers</button><button data-left="assets">Assets</button></div><section id="layersPanel"><input id="layerSearch" placeholder="Search layers"><div id="tree"></div></section><section id="assetsPanel" hidden><h4>Components</h4><div id="palette"></div><h4>Tokens</h4><button id="addToken">+ Token</button><div id="tokens"></div></section></aside>
<section class="workspace"><div class="ruler top"></div><div class="ruler side"></div><div id="stage"><div id="device" class="device phone"><div id="canvas" class="canvas"></div></div></div></section>
<aside class="right"><div class="tabs"><button data-right="design" class="active">Design</button><button data-right="prototype">Prototype</button><button data-right="inspect">Inspect</button></div><section id="designPanel"><div class="selectionBar"><button id="alignLeft">⇤</button><button id="alignCenter">↔</button><button id="alignRight">⇥</button><button id="distribute">Distribute</button></div><div id="inspector"><p>Select an element.</p></div></section><section id="prototypePanel" hidden><label>On click</label><select id="protoAction"><option value="">None</option><option value="navigate">Navigate to</option><option value="overlay">Open overlay</option><option value="back">Back</option></select><input id="protoTarget" placeholder="Target frame id"><button id="applyPrototype">Apply prototype</button><h4>Flows</h4><div id="flows"></div></section><section id="inspectPanel" hidden><h4>Generated JavaScript</h4><textarea id="code" spellcheck="false"></textarea><div><button id="applyCode">Apply code</button><button id="refreshCode">Reload</button></div><h4>Selection JSON</h4><pre id="inspectJson"></pre></section></aside>
</main>
<dialog id="figmaDialog"><form method="dialog"><h3>Import from Figma</h3><input id="figmaUrl" placeholder="https://figma.com/design/..." style="width:100%"><input id="figmaToken" type="password" placeholder="Figma personal access token" style="width:100%;margin-top:8px"><p class="hint">Token stays local to this Studio request and is not written to the project.</p><div class="dialogActions"><button value="cancel">Cancel</button><button id="figmaImport" value="default">Import</button></div></form></dialog>
<script type="module" src="/studio.js"></script></body></html>
